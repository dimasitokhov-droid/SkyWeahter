<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Погода Онлайн — Open-Meteo Live</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body {
font-family: 'Inter', sans-serif;
transition: background 0.8s ease-in-out;
}
.glass {
background: rgba(255, 255, 255, 0.15);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border: 1px solid rgba(255, 255, 255, 0.25);
}
.glass-card {
background: rgba(255, 255, 255, 0.1);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border: 1px solid rgba(255, 255, 255, 0.2);
}
::-webkit-scrollbar {
height: 6px;
width: 6px;
}
::-webkit-scrollbar-track {
background: rgba(255, 255, 255, 0.05);
border-radius: 9999px;
}
::-webkit-scrollbar-thumb {
background: rgba(255, 255, 255, 0.3);
border-radius: 9999px;
}
::-webkit-scrollbar-thumb:hover {
background: rgba(255, 255, 255, 0.5);
}
@keyframes spin {
to { transform: rotate(360deg); }
}
.animate-spin-custom {
animation: spin 1s linear infinite;
}
</style>
</head>
<body id="bodyBg" class="min-h-full bg-gradient-to-br from-blue-500 via-indigo-600 to-purple-800 text-white p-4 sm:p-6 lg:p-8 flex items-center justify-center">

<div class="w-full max-w-5xl mx-auto glass rounded-3xl shadow-2xl overflow-hidden p-6 sm:p-8 flex flex-col gap-6 relative">
<!-- Top bar: Search & Controls -->
<div class="flex flex-col sm:flex-row items-center justify-between gap-4">
<!-- Search & Quick Cities -->
<div class="relative w-full sm:w-96">
<div class="flex items-center glass-card rounded-2xl px-4 py-3 shadow-inner">
<i class="fa-solid fa-magnifying-glass text-white/70 mr-3"></i>
<input type="text" id="citySearch" placeholder="Поиск любого города мира..."
class="bg-transparent border-none outline-none text-white placeholder-white/60 w-full text-sm font-medium">
<div id="searchSpinner" class="hidden text-white/70 text-sm ml-2 animate-spin-custom">
<i class="fa-solid fa-spinner"></i>
</div>
</div>
<!-- Autocomplete Dropdown -->
<div id="searchDropdown" class="absolute left-0 right-0 mt-2 glass-card rounded-2xl overflow-hidden shadow-xl z-50 hidden max-h-60 overflow-y-auto">
<!-- Populated via API -->
</div>
</div>
<!-- Unit Toggle & Quick City Badges -->

<div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
<div class="hidden md:flex items-center gap-2 text-xs font-semibold overflow-x-auto py-1">
<button onclick="fetchWeatherByCoords(55.7522, 37.6156, 'Москва', 'Россия')" class="px-3 py-1.5 rounded-xl glass-card hover:bg-white/20 transition">Москва</button>
<button onclick="fetchWeatherByCoords(40.7128, -74.0060, 'Нью-Йорк', 'США')" class="px-3 py-1.5 rounded-xl glass-card hover:bg-white/20 transition">Нью-Йорк</button>
<button onclick="fetchWeatherByCoords(35.6762, 139.6503, 'Токио', 'Япония')" class="px-3 py-1.5 rounded-xl glass-card hover:bg-white/20 transition">Токио</button>
<button onclick="fetchWeatherByCoords(51.5074, -0.1278, 'Лондон', 'Великобритания')" class="px-3 py-1.5 rounded-xl glass-card hover:bg-white/20 transition">Лондон</button>
</div>
<!-- °C / °F Switcher -->

<div class="glass-card p-1 rounded-2xl flex items-center shadow-inner">
<button id="unitCelsius" onclick="setUnit('C')" class="px-3 py-1.5 rounded-xl text-sm font-bold bg-white/30 text-white shadow transition">°C</button>
<button id="unitFahrenheit" onclick="setUnit('F')" class="px-3 py-1.5 rounded-xl text-sm font-bold text-white/70 hover:text-white transition">°F</button>
</div>
</div>
</div>
<!-- Main Content Grid -->

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 relative">
<!-- Loading Overlay -->
<div id="loadingOverlay" class="absolute inset-0 bg-black/20 backdrop-blur-md rounded-3xl z-40 flex items-center justify-center hidden">
<div class="flex flex-col items-center gap-3">
<div class="text-4xl animate-spin-custom">
<i class="fa-solid fa-circle-notch"></i>
</div>
<span class="text-sm font-medium tracking-wide">Загрузка данных погоды...</span>
</div>
</div>
<!-- Left Column: Current Weather & Details -->
<div class="lg:col-span-1 flex flex-col gap-6">

<!-- Current Weather Card -->
<div class="glass-card rounded-3xl p-6 flex flex-col justify-between relative overflow-hidden shadow-lg">
<div class="absolute -right-6 -top-6 text-white/10 text-9xl pointer-events-none">
<i id="bgWeatherIcon" class="fa-solid fa-sun"></i>
</div>
<div>
<div class="flex items-center justify-between">
<h2 id="cityName" class="text-2xl font-bold tracking-tight">Москва</h2>
<span id="countryName" class="text-xs uppercase px-2.5 py-1 rounded-lg bg-white/20 font-semibold tracking-wider">Россия</span>
</div>
<p id="currentDate" class="text-xs text-white/70 mt-1">Загрузка...</p>
</div>
<div class="my-6 flex items-center gap-6">
<div id="mainWeatherIcon" class="text-6xl drop-shadow-md">

☀️
</div>
<div>
<div class="flex items-start">
<span id="currentTemp" class="text-6xl font-extrabold tracking-tighter">--</span>
<span class="text-2xl font-bold mt-1 ml-1" id="tempSymbol">°C</span>
</div>
<p id="weatherConditionText" class="text-sm font-medium text-white/90 capitalize mt-1">Загрузка...</p>
</div>
</div>
<div class="border-t border-white/20 pt-4 flex justify-between text-xs text-white/80">
<span>Ощущается как <strong id="feelsLike" class="text-white">--°C</strong></span>

<span>Макс/Мин: <strong id="maxMinTemp" class="text-white">--° / --°</strong></span>
</div>
</div>
<!-- Weather Details Grid -->
<div class="glass-card rounded-3xl p-6 grid grid-cols-2 gap-4">

<div class="glass-card p-3.5 rounded-2xl flex flex-col justify-between">
<div class="flex items-center text-white/70 text-xs gap-2">
<i class="fa-solid fa-droplet"></i>
<span>Влажность</span>
</div>
<p id="humidity" class="text-lg font-bold mt-2">--%</p>
</div>
<div class="glass-card p-3.5 rounded-2xl flex flex-col justify-between">
<div class="flex items-center text-white/70 text-xs gap-2">
<i class="fa-solid fa-wind"></i>
<span>Ветер</span>
</div>
<p id="windSpeed" class="text-lg font-bold mt-2">-- м/с</p>
</div>
<div class="glass-card p-3.5 rounded-2xl flex flex-col justify-between">
<div class="flex items-center text-white/70 text-xs gap-2">
<i class="fa-solid fa-cloud-rain"></i>
<span>Осадки</span>
</div>
<p id="precipitation" class="text-lg font-bold mt-2">-- мм</p>
</div>
<div class="glass-card p-3.5 rounded-2xl flex flex-col justify-between">
<div class="flex items-center text-white/70 text-xs gap-2">
<i class="fa-solid fa-gauge"></i>
<span>Давление</span>
</div>
<p id="pressure" class="text-lg font-bold mt-2">-- гПа</p>
</div>
</div>
</div>
<!-- Right Column: Hourly & 7-Day Forecast -->
<div class="lg:col-span-2 flex flex-col gap-6">

<!-- Hourly Forecast -->
<div class="glass-card rounded-3xl p-6">
<h3 class="text-sm font-semibold text-white/80 mb-4 flex items-center gap-2">
<i class="fa-regular fa-clock"></i> Прогноз на 24 часа
</h3>
<div id="hourlyContainer" class="flex gap-4 overflow-x-auto pb-2 scroll-smooth">
<!-- Populated by API -->
</div>
</div>
<!-- 7-Day Forecast -->
<div class="glass-card rounded-3xl p-6 flex-1">
<h3 class="text-sm font-semibold text-white/80 mb-4 flex items-center gap-2">

<i class="fa-regular fa-calendar-days"></i> Прогноз на 7 дней
</h3>
<div id="weeklyContainer" class="flex flex-col gap-3">
<!-- Populated by API -->
</div>
</div>
</div>
</div>
</div>

<!-- Custom Message Box Modal (No alert()) -->

<div id="msgModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 hidden">

<div class="glass p-6 rounded-3xl max-w-sm w-full mx-4 shadow-2xl text-center flex flex-col gap-4">

<h3 id="msgTitle" class="text-lg font-bold">Уведомление</h3>
<p id="msgText" class="text-sm text-white/80"></p>
<button onclick="closeModal()" class="w-full py-2.5 rounded-2xl bg-white/20 hover:bg-white/30 font-semibold transition">ОК</button>
</div>
</div>
<script>
let currentUnit = "C";
let activeCity = {

name: "Москва",
country: "Россия",
lat: 55.7522,
lon: 37.6156
};
let lastWeatherData = null;
// Weather code helper (WMO Weather interpretation codes)
function getWeatherDetails(code) {
switch (code) {

case 0: return { text: "Ясно", icon: "☀️", bg: "from-blue-500 via-indigo-600 to-purple-800", fa: "fa-solid fa-sun" };
case 1:
case 2: return { text: "Переменная облачность", icon: "⛅", bg: "from-sky-500 via-indigo-600 to-slate-800", fa: "fa-solid fa-cloud-sun" };
case 3: return { text: "Пасмурно", icon: "☁️", bg: "from-slate-600 via-zinc-700 to-slate-800", fa: "fa-solid fa-cloud" };
case 45:
case 48: return { text: "Туман", icon: "🌫️", bg: "from-zinc-600 via-slate-700 to-zinc-900", fa: "fa-solid fa-smog" };
case 51:
case 53:
case 55:
case 56:
case 57: return { text: "Морось", icon: "🌧️", bg: "from-blue-700 via-slate-800 to-slate-900", fa: "fa-solid fa-cloud-rain" };
case 61:
case 63:
case 65:
case 66:
case 67: return { text: "Дождь", icon: "🌧️", bg: "from-blue-800 via-indigo-900 to-slate-900", fa: "fa-solid fa-cloud-showers-heavy" };
case 71:
case 73:
case 75:
case 77: return { text: "Снег", icon: "❄️", bg: "from-slate-500 via-blue-700 to-indigo-900", fa: "fa-solid fa-snowflake" };
case 80:
case 81:
case 82: return { text: "Ливни", icon: "🌧️", bg: "from-blue-900 via-slate-900 to-purple-950", fa: "fa-solid fa-cloud-rain" };
case 85:
case 86: return { text: "Снегопад", icon: "❄️", bg: "from-slate-600 via-indigo-900 to-slate-900", fa: "fa-solid fa-snowflake" };
case 95:
case 96:
case 99: return { text: "Гроза", icon: "⛈️", bg: "from-purple-900 via-slate-900 to-black", fa: "fa-solid fa-cloud-bolt" };
default: return { text: "Облачно", icon: "☁️", bg: "from-blue-500 via-indigo-600 to-purple-800", fa: "fa-solid fa-cloud" };
}
}
function formatTemp(tempC) {
if (tempC === undefined || tempC === null) return "--";
if (currentUnit === "F") {

return Math.round(tempC * 9/5 + 32);
}
return Math.round(tempC);
}
function setLoading(isLoading) {
const overlay = document.getElementById("loadingOverlay");
if (isLoading) {
overlay.classList.remove("hidden");

} else {
overlay.classList.add("hidden");
}
}
async function fetchWeatherByCoords(lat, lon, cityName, countryName) {
activeCity = { name: cityName, country: countryName, lat, lon };
setLoading(true);
try {

const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,surface_pressure,wind_speed_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`);
if (!response.ok) throw new Error("Ошибка сети при получении данных погоды");
const data = await response.json();

lastWeatherData = data;
renderWeatherData(data, cityName, countryName);
} catch (err) {
console.error(err);
showModal("Ошибка соединения", "Не удалось загрузить данные погоды. Проверьте интернет-соединение.");
} finally {
setLoading(false);
}
}
function renderWeatherData(data, cityName, countryName) {
document.getElementById("cityName").innerText = cityName;
document.getElementById("countryName").innerText = countryName || "";
const current = data.current;
const daily = data.daily;

const weatherInfo = getWeatherDetails(current.weather_code);
// Background
document.getElementById("bodyBg").className = `min-h-full bg-gradient-to-br ${weatherInfo.bg} text-white p-4 sm:p-6 lg:p-8 flex items-center justify-center transition-all duration-700`;
// Current Weather

document.getElementById("currentTemp").innerText = formatTemp(current.temperature_2m);
document.getElementById("tempSymbol").innerText = currentUnit === "C" ? "°C" : "°F";

document.getElementById("weatherConditionText").innerText = weatherInfo.text;

document.getElementById("mainWeatherIcon").innerText = weatherInfo.icon;
document.getElementById("bgWeatherIcon").className = weatherInfo.fa;

document.getElementById("feelsLike").innerText = `${formatTemp(current.apparent_temperature)}°${currentUnit}`;
const maxTempToday = daily.temperature_2m_max[0];
const minTempToday = daily.temperature_2m_min[0];
document.getElementById("maxMinTemp").innerText = `${formatTemp(maxTempToday)}° / ${formatTemp(minTempToday)}°`;
// Details
document.getElementById("humidity").innerText = `${current.relative_humidity_2m}%`;

document.getElementById("windSpeed").innerText = `${current.wind_speed_10m} м/с`;
document.getElementById("precipitation").innerText = `${current.precipitation} мм`;
document.getElementById("pressure").innerText = `${Math.round(current.surface_pressure)} гПа`;
// Hourly Forecast (Next 24 hours starting from current hour index)
const hourlyContainer = document.getElementById("hourlyContainer");

hourlyContainer.innerHTML = "";
const nowIndex = new Date().getHours();
for (let i = nowIndex; i < nowIndex + 24 && i < data.hourly.time.length; i++) {
const timeStr = new Date(data.hourly.time[i]).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const code = data.hourly.weather_code[i];

const tempC = data.hourly.temperature_2m[i];
const info = getWeatherDetails(code);
const card = document.createElement("div");
card.className = "flex flex-col items-center justify-between glass-card p-4 rounded-2xl min-w-[76px] flex-shrink-0 transition hover:bg-white/20";
card.innerHTML = `
<span class="text-xs text-white/70">${i === nowIndex ? 'Сейчас' : timeStr}</span>
<span class="text-2xl my-2">${info.icon}</span>
<span class="text-sm font-bold">${formatTemp(tempC)}°</span>
`;
hourlyContainer.appendChild(card);

}
// 7-Day Forecast
const weeklyContainer = document.getElementById("weeklyContainer");
weeklyContainer.innerHTML = "";
for (let i = 0; i < daily.time.length; i++) {
const dateObj = new Date(daily.time[i]);
const dayName = i === 0 ? "Сегодня" : dateObj.toLocaleDateString('ru-RU', { weekday: 'long' });
const code = daily.weather_code[i];
const maxC = daily.temperature_2m_max[i];

const minC = daily.temperature_2m_min[i];
const info = getWeatherDetails(code);
const row = document.createElement("div");

row.className = "flex items-center justify-between glass-card px-4 py-3 rounded-2xl transition hover:bg-white/20";
row.innerHTML = `
<span class="text-sm font-medium w-28 capitalize">${dayName}</span>
<div class="flex items-center gap-3">
<span class="text-lg">${info.icon}</span>
<span class="text-xs text-white/70 hidden sm:inline">${info.text}</span>
</div>

<div class="flex items-center gap-4 text-sm font-semibold">
<span>${formatTemp(maxC)}°</span>
<span class="text-white/50">${formatTemp(minC)}°</span>
</div>
`;
weeklyContainer.appendChild(row);
}
}
function setUnit(unit) {
currentUnit = unit;
if (unit === "C") {
document.getElementById("unitCelsius").className = "px-3 py-1.5 rounded-xl text-sm font-bold bg-white/30 text-white shadow transition";
document.getElementById("unitFahrenheit").className = "px-3 py-1.5 rounded-xl text-sm font-bold text-white/70 hover:text-white transition";
} else {
document.getElementById("unitFahrenheit").className = "px-3 py-1.5 rounded-xl text-sm font-bold bg-white/30 text-white shadow transition";
document.getElementById("unitCelsius").className = "px-3 py-1.5 rounded-xl text-sm font-bold text-white/70 hover:text-white transition";

}
if (lastWeatherData) {
renderWeatherData(lastWeatherData, activeCity.name, activeCity.country);
}
}
// Live Geocoding Search
const citySearchInput = document.getElementById("citySearch");
const searchDropdown = document.getElementById("searchDropdown");
const searchSpinner = document.getElementById("searchSpinner");
let searchTimeout = null;
citySearchInput.addEventListener("input", (e) => {
const query = e.target.value.trim();
clearTimeout(searchTimeout);

if (query.length < 2) {
searchDropdown.classList.add("hidden");
searchSpinner.classList.add("hidden");
return;
}

searchSpinner.classList.remove("hidden");
searchTimeout = setTimeout(async () => {
try {

const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=ru&format=json`);
const data = await res.json();
searchDropdown.innerHTML = "";
if (data.results && data.results.length > 0) {
data.results.forEach(city => {

const div = document.createElement("div");

div.className = "px-4 py-3 hover:bg-white/20 cursor-pointer flex items-center justify-between transition border-b border-white/10 last:border-none";
div.innerHTML = `
<div>
<span class="font-medium">${city.name}</span>
<span class="text-xs text-white/70 ml-1">${city.country || ''} ${city.admin1 ? '(' + city.admin1 + ')' : ''}</span>
</div>
<span class="text-xs px-2 py-1 rounded bg-white/10 font-semibold">Выбрать</span>
`;
div.onclick = () => {
fetchWeatherByCoords(city.latitude, city.longitude, city.name, city.country);
searchDropdown.classList.add("hidden");
citySearchInput.value = "";
};
searchDropdown.appendChild(div);
});
searchDropdown.classList.remove("hidden");
} else {
searchDropdown.innerHTML = `<div class="px-4 py-3 text-sm text-white/70">Город не найден</div>`;
searchDropdown.classList.remove("hidden");
}
} catch (err) {
console.error(err);
} finally {
searchSpinner.classList.add("hidden");
}
}, 400);
});
// Close dropdown when clicking outside
document.addEventListener("click", (e) => {
if (!citySearchInput.contains(e.target) && !searchDropdown.contains(e.target)) {
searchDropdown.classList.add("hidden");
}
});
function showModal(title, text) {
