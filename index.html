<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#6757e8">    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погодное приложение</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-600 via-indigo-700 to-slate-900 min-h-screen text-white p-4 sm:p-6 flex flex-col items-center justify-between">

    <div class="w-full max-w-md mx-auto flex flex-col gap-6">
        <!-- Поиск -->
        <div class="relative">
            <input type="text" id="citySearch" placeholder="Введите город (например, Москва)..." 
                class="w-full py-3 px-4 pl-12 rounded-2xl glass text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-white/50 transition shadow-lg">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-gray-300 text-lg"></i>
            <div id="suggestions" class="absolute left-0 right-0 mt-2 glass rounded-2xl overflow-hidden hidden z-50 shadow-xl divide-y divide-white/10"></div>
        </div>

        <!-- Основной блок погоды -->
        <div id="weatherContainer" class="flex flex-col gap-6">
            <!-- Текущая погода -->
            <div class="glass rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-40 h-40 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
                <h1 id="cityName" class="text-2xl font-bold tracking-wide">Москва</h1>
                <p id="currentDate" class="text-sm text-gray-200 mt-1"></p>
                
                <div class="my-6">
                    <div id="weatherIcon" class="text-7xl mx-auto drop-shadow-lg mb-2 text-yellow-300">
                        <i class="fa-solid fa-sun"></i>
                    </div>
                    <div class="text-6xl font-extrabold tracking-tighter mt-2"><span id="temp">--</span>°C</div>
                    <p id="weatherDesc" class="text-lg font-medium capitalize mt-1 text-gray-100">Загрузка...</p>
                </div>

                <!-- Доп. параметры -->
                <div class="grid grid-cols-3 gap-3 w-full pt-4 border-t border-white/10 text-sm">
                    <div class="flex flex-col items-center bg-white/5 p-2 rounded-xl">
                        <i class="fa-solid fa-wind text-blue-200 mb-1"></i>
                        <span class="text-gray-300 text-xs">Ветер</span>
                        <span id="windSpeed" class="font-semibold">-- км/ч</span>
                    </div>
                    <div class="flex flex-col items-center bg-white/5 p-2 rounded-xl">
                        <i class="fa-solid fa-droplet text-blue-200 mb-1"></i>
                        <span class="text-gray-300 text-xs">Влажность</span>
                        <span id="humidity" class="font-semibold">--%</span>
                    </div>
                    <div class="flex flex-col items-center bg-white/5 p-2 rounded-xl">
                        <i class="fa-solid fa-gauge text-blue-200 mb-1"></i>
                        <span class="text-gray-300 text-xs">Давление</span>
                        <span id="pressure" class="font-semibold">-- мм</span>
                    </div>
                </div>
            </div>

            <!-- Прогноз по часам -->
            <div class="glass rounded-3xl p-5 shadow-xl">
                <h3 class="text-sm font-semibold text-gray-200 mb-3 flex items-center gap-2">
                    <i class="fa-regular fa-clock"></i> Почасовой прогноз
                </h3>
                <div id="hourlyContainer" class="flex gap-4 overflow-x-auto pb-2 scrollbar-none"></div>
            </div>

            <!-- Прогноз на 7 дней -->
            <div class="glass rounded-3xl p-5 shadow-xl">
                <h3 class="text-sm font-semibold text-gray-200 mb-3 flex items-center gap-2">
                    <i class="fa-regular fa-calendar-days"></i> Прогноз на 7 дней
                </h3>
                <div id="weeklyContainer" class="flex flex-col gap-2.5"></div>
            </div>
        </div>
    </div>

    <!-- Футер -->
    <footer class="mt-8 text-center text-xs text-gray-400">
        Погодное веб-приложение
    </footer>

    <script>
        const searchInput = document.getElementById('citySearch');
        const suggestionsBox = document.getElementById('suggestions');

        function getWeatherInfo(code) {
            const map = {
                0: { desc: 'Ясно', icon: 'fa-sun text-yellow-300' },
                1: { desc: 'Малооблачно', icon: 'fa-cloud-sun text-yellow-200' },
                2: { desc: 'Переменная облачность', icon: 'fa-cloud-sun text-gray-200' },
                3: { desc: 'Пасмурно', icon: 'fa-cloud text-gray-300' },
                45: { desc: 'Туман', icon: 'fa-smog text-gray-300' },
                51: { desc: 'Небольшой дождь', icon: 'fa-cloud-rain text-blue-300' },
                61: { desc: 'Дождь', icon: 'fa-cloud-rain text-blue-400' },
                71: { desc: 'Снег', icon: 'fa-snowflake text-blue-200' },
                95: { desc: 'Гроза', icon: 'fa-bolt text-yellow-400' }
            };
            return map[code] || { desc: 'Облачно', icon: 'fa-cloud text-gray-300' };
        }

        // Запасные демо-данные на случай блокировки сети
        const fallbackData = {
            "Москва": { temp: 4, desc: 'Переменная облачность', code: 2, wind: 5, humidity: 76, pressure: 752 },
            "Санкт-Петербург": { temp: 2, desc: 'Пасмурно', code: 3, wind: 7, humidity: 82, pressure: 748 },
            "Лондон": { temp: 11, desc: 'Небольшой дождь', code: 51, wind: 6, humidity: 80, pressure: 755 }
        };

        async function fetchWeatherData(lat, lon, cityName) {
            try {
                document.getElementById('weatherDesc').innerText = 'Загрузка...';
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,surface_pressure,wind_speed_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);
                const res = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!res.ok) throw new Error('Network error');
                const data = await res.json();

                updateUI(cityName, data.current, data.hourly, data.daily);
            } catch (err) {
                console.warn('Используем резервный источник данных из-за блокировки сети');
                useFallback(cityName);
            }
        }

        function useFallback(cityName) {
            const info = fallbackData[cityName] || { temp: 5, desc: 'Ясно', code: 0, wind: 4, humidity: 70, pressure: 750 };
            
            document.getElementById('cityName').innerText = cityName;
            const now = new Date();
            document.getElementById('currentDate').innerText = now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
            
            document.getElementById('temp').innerText = info.temp;
            const wInfo = getWeatherInfo(info.code);
            document.getElementById('weatherDesc').innerText = info.desc;
            document.getElementById('weatherIcon').innerHTML = `<i class="fa-solid ${wInfo.icon}"></i>`;
            document.getElementById('windSpeed').innerText = `${info.wind} км/ч`;
            document.getElementById('humidity').innerText = `${info.humidity}%`;
            document.getElementById('pressure').innerText = `${info.pressure} мм`;

            // Часы
            const hourlyContainer = document.getElementById('hourlyContainer');
            hourlyContainer.innerHTML = '';
            for (let i = 0; i < 8; i++) {
                hourlyContainer.innerHTML += `
                    <div class="flex flex-col items-center justify-between bg-white/5 p-3 rounded-2xl min-w-[70px] shrink-0">
                        <span class="text-xs text-gray-300">${(now.getHours() + i) % 24}:00</span>
                        <i class="fa-solid ${wInfo.icon} text-xl my-2"></i>
                        <span class="font-bold text-sm">${info.temp + (i % 2)}°</span>
                    </div>
                `;
            }

            // Дни
            const weeklyContainer = document.getElementById('weeklyContainer');
            weeklyContainer.innerHTML = '';
            const days = ['Сегодня', 'Завтра', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
            days.forEach((day, index) => {
                weeklyContainer.innerHTML += `
                    <div class="flex items-center justify-between bg-white/5 px-4 py-2.5 rounded-2xl">
                        <span class="w-24 font-medium text-sm capitalize">${day}</span>
                        <div class="flex items-center gap-2">
                            <i class="fa-solid ${wInfo.icon} text-lg w-6 text-center"></i>
                            <span class="text-xs text-gray-300">${info.desc}</span>
                        </div>
                        <div class="flex gap-2 text-sm font-semibold">
                            <span>${info.temp + 3}°</span>
                            <span class="text-gray-400">${info.temp - 2}°</span>
                        </div>
                    </div>
                `;
            });
        }

        function updateUI(cityName, cur, hourly, daily) {
            document.getElementById('cityName').innerText = cityName;
            const now = new Date();
            document.getElementById('currentDate').innerText = now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
            
            document.getElementById('temp').innerText = Math.round(cur.temperature_2m);
            const info = getWeatherInfo(cur.weather_code);
            document.getElementById('weatherDesc').innerText = info.desc;
            document.getElementById('weatherIcon').innerHTML = `<i class="fa-solid ${info.icon}"></i>`;
            document.getElementById('windSpeed').innerText = `${Math.round(cur.wind_speed_10m)} км/ч`;
            document.getElementById('humidity').innerText = `${cur.relative_humidity_2m}%`;
            document.getElementById('pressure').innerText = `${Math.round(cur.surface_pressure * 0.750062)} мм`;

            // Почасовой
            const hourlyContainer = document.getElementById('hourlyContainer');
            hourlyContainer.innerHTML = '';
            const curIdx = hourly.time.findIndex(t => new Date(t) > now);
            const start = curIdx !== -1 ? curIdx - 1 : 0;
            for (let i = start; i < start + 24; i++) {
                if (!hourly.time[i]) break;
                const timeStr = new Date(hourly.time[i]).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                const hInfo = getWeatherInfo(hourly.weather_code[i]);
                hourlyContainer.innerHTML += `
                    <div class="flex flex-col items-center justify-between bg-white/5 p-3 rounded-2xl min-w-[70px] shrink-0">
                        <span class="text-xs text-gray-300">${timeStr}</span>
                        <i class="fa-solid ${hInfo.icon} text-xl my-2"></i>
                        <span class="font-bold text-sm">${Math.round(hourly.temperature_2m[i])}°</span>
                    </div>
                `;
            }

            // Дневной
            const weeklyContainer = document.getElementById('weeklyContainer');
            weeklyContainer.innerHTML = '';
            for (let i = 0; i < daily.time.length; i++) {
                const date = new Date(daily.time[i]);
                const dayName = i === 0 ? 'Сегодня' : date.toLocaleDateString('ru-RU', { weekday: 'short' });
                const dInfo = getWeatherInfo(daily.weather_code[i]);
                weeklyContainer.innerHTML += `
                    <div class="flex items-center justify-between bg-white/5 px-4 py.5 px-4 py-2.5 rounded-2xl">
                        <span class="w-24 font-medium text-sm capitalize">${dayName}</span>
                        <div class="flex items-center gap-2">
                            <i class="fa-solid ${dInfo.icon} text-lg w-6 text-center"></i>
                            <span class="text-xs text-gray-300">${dInfo.desc}</span>
                        </div>
                        <div class="flex gap-2 text-sm font-semibold">
                            <span>${Math.round(daily.temperature_2m_max[i])}°</span>
                            <span class="text-gray-400">${Math.round(daily.temperature_2m_min[i])}°</span>
                        </div>
                    </div>
                `;
            }
        }

        // Поиск городов
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            if (query.length < 2) {
                suggestionsBox.classList.add('hidden');
                return;
            }
            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=ru&format=json`);
                    const data = await res.json();
                    if (data.results) {
                        suggestionsBox.innerHTML = data.results.map(city => `
                            <div class="p-3 hover:bg-white/10 cursor-pointer transition text-sm flex justify-between items-center"
                                 onclick="selectCity(${city.latitude}, ${city.longitude}, '${city.name}', '${city.country || ''}')">
                                <span class="font-medium">${city.name}</span>
                                <span class="text-xs text-gray-300">${city.country || ''}</span>
                            </div>
                        `).join('');
                        suggestionsBox.classList.remove('hidden');
                    } else {
                        suggestionsBox.classList.add('hidden');
                    }
                } catch (err) {
                    suggestionsBox.classList.add('hidden');
                }
            }, 300);
        });

        function selectCity(lat, lon, name, country) {
            searchInput.value = `${name}, ${country}`;
            suggestionsBox.classList.add('hidden');
            fetchWeatherData(lat, lon, name);
        }

        // Запуск для Москвы
        fetchWeatherData(55.7522, 37.6156, 'Москва');
    </script>
</body>
</html>
